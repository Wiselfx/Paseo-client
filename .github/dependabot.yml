# Keeps this repository's own dependencies current. Each ecosystem is grouped into one pull request per week,
# to keep review load low.
version: 2
updates:
  # The actions used by the workflows in .github/workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  # Swift package dependencies. PaseoCore has none on purpose; PaseoUI's live here.
  - package-ecosystem: "swift"
    directory: "/Packages/PaseoUI"
    schedule:
      interval: "weekly"
    groups:
      swift-packages:
        patterns: ["*"]
