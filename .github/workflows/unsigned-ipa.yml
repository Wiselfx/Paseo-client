name: Unsigned IPA

# Builds the app for device with code signing off and packages it as an unsigned .ipa
# (re-sign or sideload it yourself). Runs on every push to main, on pull requests, and by hand.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    # The Xcode 27 image (macOS 27, Apple Silicon); runner labels are named by Xcode now.
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The code uses the iOS 27 SDK (Xcode 27 APIs); the deployment target stays iOS 26.
      - name: Select Xcode 27
        run: |
          ls -d /Applications/Xcode*.app
          # 27.1 matches local development; otherwise the newest 27.x release on the image.
          XCODE=$(ls -d /Applications/Xcode_27.1*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XCODE" ] || XCODE=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "::error::No Xcode 27 on this runner image"
            exit 1
          fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      # project.yml is the source of truth for the Xcode project.
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd App && xcodegen generate

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/spm
          key: spm-${{ hashFiles('Packages/*/Package.resolved', 'Packages/*/Package.swift') }}
          restore-keys: spm-

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project App/PaseoClient.xcodeproj \
            -scheme PaseoClient \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Paseo.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" \
            | if command -v xcbeautify >/dev/null; then xcbeautify --renderer github-actions; else cat; fi

      - name: List compile errors
        if: failure()
        run: |
          grep -E "error:" "$RUNNER_TEMP/xcodebuild.log" | sort -u | head -300 || true

      - name: Package the IPA
        run: |
          APP=$(ls -d "$RUNNER_TEMP"/Paseo.xcarchive/Products/Applications/*.app | head -1)
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qry Paseo-unsigned.ipa Payload
          ls -lh Paseo-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Paseo-unsigned-ipa
          path: ${{ runner.temp }}/ipa/Paseo-unsigned.ipa
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
