name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: PaseoCore (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:6.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and test
        working-directory: Packages/PaseoCore
        run: swift test
